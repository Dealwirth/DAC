set_work_time:
  name: Arbeitszeit setzen
  description: >-
    Setzt den Arbeitsbeginn und berechnet daraus automatisch die Weckzeit
    (Arbeitsbeginn minus Offset). Auch für NFC-Tags geeignet.
  fields:
    time:
      name: Arbeitsbeginn
      description: Arbeitsbeginn als Zeit, z. B. "08:00"
      required: true
      example: "08:00"
      selector:
        time:
    day:
      name: Tag
      description: ">"
      selector:
        text:
    clear:
      name: Zurücksetzen
      description: Setzt die manuelle Arbeitszeit zurück (Fallback greift wieder).
      default: false
      selector:
        boolean:

stop_alarm:
  name: Wecker stoppen
  description: Stoppt die laufende Weck-Schleife (Licht + Media-Player).

dismiss_for_today:
  name: Für heute deaktivieren
  description: Deaktiviert den Wecker für den aktuellen bzw. kommenden Tag.
  fields:
    day:
      name: Tag
      description: Optionales Datum (ISO), das deaktiviert werden soll.
      selector:
        text:

set_alexa_alarm:
  name: Alexa-Wecker synchronisieren
  description: >-
    Stellt den berechneten DAC-Wecker zusätzlich als echten Wecker auf dem
    Echo-Gerät (Textbefehl mit "morgens"/"abends", keine Rückfragen von
    Alexa). Löscht vorher exakt nur den zuvor von DAC gesetzten Wecker.
  fields:
    time:
      name: Weckzeit
      description: Optionale abweichende Zeit (sonst die aktuell berechnete Weckzeit).
      example: "06:00"
      selector:
        time:
    day:
      name: Tag
      description: Optionales Datum (ISO).
      selector:
        text:

clear_alexa_alarm:
  name: Alexa-Wecker löschen (nur DAC-eigener)
  description: >-
    Löscht exakt nur den Wecker, den DAC selbst gesetzt hat (gespeichert im
    Helfer input_text.gestellter_alexa_wecker). Manuell auf der Alexa
    gestellte Wecker bleiben unberührt.
