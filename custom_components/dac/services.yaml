set_work_time:
  name: Arbeitszeit setzen
  description: >-
    Setzt den Arbeitsbeginn und berechnet daraus automatisch die Weckzeit
    (Arbeitsbeginn minus Offset). Auch für NFC-Tags geeignet.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:
    time:
      name: Arbeitsbeginn
      description: Arbeitsbeginn als Zeit, z. B. "08:00"
      required: false
      example: "08:00"
      selector:
        time:
    day:
      name: Tag
      description: Optionales Datum (ISO, z. B. "2026-09-07") für den Arbeitsbeginn.
      selector:
        text:
    clear:
      name: Zurücksetzen
      description: Setzt die manuelle Arbeitszeit zurück (Fallback greift wieder).
      default: false
      selector:
        boolean:

stop_alarm:
  name: Wecker stoppen
  description: >-
    Stoppt die laufende Weck-Schleife (Licht + Media-Player) und den Echo-Wecker.
    Genau dieser Dienst wird auch von der Alexa-Routine „DAC Stopp“ aufgerufen,
    damit der Wecker per Sprache beendet werden kann.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:

start_test_alarm:
  name: Testwecker starten
  description: >-
    Stellt einen einmaligen Testwecker, der nach X Minuten klingelt (Standard
    aus den Einstellungen). Verhält sich exakt wie der echte Wecker: Licht,
    Lautsprecher, Echo-Vorab-Wecker und Alexa-Gate – so lässt sich die komplette
    Kette gefahrlos prüfen. Gestoppt wird er über dac.stop_alarm, den Panel-
    Button oder das Alexa-Stopp-Wort.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:
    minutes:
      name: Minuten bis zum Klingeln
      description: Optional – überschreibt die eingestellte Testdauer.
      example: 1
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

cancel_test_alarm:
  name: Testwecker abbrechen
  description: Bricht einen noch nicht klingelnden Testwecker ab.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:

dismiss_for_today:
  name: Für heute deaktivieren
  description: Deaktiviert den Wecker für den aktuellen bzw. kommenden Tag.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:
    day:
      name: Tag
      description: Optionales Datum (ISO), das deaktiviert werden soll.
      selector:
        text:

set_alexa_alarm:
  name: Alexa-Wecker synchronisieren
  description: >-
    Stellt den berechneten DAC-Wecker zusätzlich als echten Wecker auf dem
    Echo-Gerät (Textbefehl mit "morgens"/"abends", keine Rückfragen von
    Alexa). Löscht vorher exakt nur den zuvor von DAC gesetzten Wecker.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:
    time:
      name: Weckzeit
      description: Optionale abweichende Zeit (sonst die aktuell berechnete Weckzeit).
      example: "06:00"
      selector:
        time:
    day:
      name: Tag
      description: >-
        Optionales Datum (ISO). Hinweis: Alexa-Gerätewecker gelten immer für das
        nächste Auftreten der Uhrzeit, ein konkretes Datum kann per Sprachbefehl
        nicht gesetzt werden.
      selector:
        text:

clear_alexa_alarm:
  name: Alexa-Wecker löschen (nur DAC-eigener)
  description: >-
    Löscht exakt nur den Wecker, den DAC selbst gesetzt hat (gespeichert im
    Helfer input_text.gestellter_alexa_wecker). Manuell auf der Alexa
    gestellte Wecker bleiben unberührt.
  fields:
    config_entry_id:
      name: Config-Eintrag
      description: >-
        Nur nötig, wenn mehrere DAC-Einträge existieren – wählt die passende
        Instanz explizit aus.
      selector:
        text:
